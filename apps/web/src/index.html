<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>NS Studio — Portfolio développeur full-stack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Ces balises ne servent pas la page elle-même : elles servent le lien. Quand l'adresse est
      collée dans un courriel, sur LinkedIn ou dans une messagerie, c'est ce texte qui s'affiche
      dans l'aperçu. Sans elles, l'aperçu serait vide — ou pire, rempli au hasard.
      Le titre reste volontairement neutre pour ne pas se désynchroniser
      du contenu de profile.fr.json à chaque mise à jour.
    -->
    <meta
      name="description"
      content="Portfolio de NS Studio : développement full-stack, interfaces Angular, API Hono, Cloudflare Workers et architecture modulaire."
    />
    <meta name="author" content="NS Studio" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="NS Studio — Portfolio développeur full-stack" />
    <meta
      property="og:description"
      content="Portfolio de NS Studio : développement full-stack, interfaces Angular, API Hono, Cloudflare Workers et architecture modulaire."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />

    <!-- Une icône en ligne : pas de requête supplémentaire, et pas de 404 sur /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='64' font-size='34' font-family='Arial,sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'>NS</text></svg>"
    />
  </head>
  <body>
    <ns-root></ns-root>
  </body>
</html>
